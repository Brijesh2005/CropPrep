# STAM (Spatial-Temporal Alignment Module) configuration.
#
# LEGACY CONFIG — superseded by the Phase-2 active pipeline
# (``training/prepare_data.py`` + ``data/master.csv``). Retained only for the
# historic R5.x STAM chain; it is NOT read by the new training entry points.
#
# Phase-2 excluded datasets are removed from ``tables``:
#   * data_season.csv (kg/ha village records)
#   * ICRISAT-District Level Data.csv (district-level annual series)
#
# Resolution precedence: ST_* environment variables (``__``-nested) > this
# file > built-in defaults. See ``training/stam/config.py`` for every option.

patch:
  size: 224
  pad_mode: constant
  pad_value: 0.0
  edge_correction: true

spatial:
  max_search_radius_km: 5.0
  distance_threshold_km: 5.0
  kdtree_leaf_size: 40
  duplicate_tolerance_m: 50.0

temporal:
  default_year: null
  default_season: null
  tolerance_days: 15
  max_gap_days: 60
  # Project calendar (Kharif / Rabi / Zaid). Resolved against the repository
  # root by the pipeline driver.
  season_file: seasons.yaml

image:
  resolution: R10m
  index_types: [NDVI, EVI]
  require_pairs: true

# Temporal imagery acquisition window. "season" is the legacy behaviour —
# only composites inside the season calendar window. For seasonal-composite
# mounts (Kaggle NDVI/EVI: ~5 dates/year clustered late-Apr/May and late-Oct),
# a season window resolves exactly one frame for Kharif surveys; the campaign
# overrides this via ST_IMAGERY__* (see R5.3: multi-season windows).
imagery:
  mode: season
  window_days: 180
  start_month: 5
  span_months: 12
  max_observations: 8
  strategy: closest_to_survey
  require_pairs: true

quality:
  max_temporal_gap_days: 60
  min_observations: 1
  fail_below: 40.0

cache:
  enabled: true
  observation_ttl_seconds: 3600
  index_ttl_seconds: 86400

admin:
  # Karnataka KGIS boundary layers. Each source carries its own KGIS
  # attribute as ``name_column`` and its administrative ``level`` so the
  # combined boundary index exposes both district and taluk names.
  boundaries:
    - path: application/gis/District/District.shp
      name_column: KGISDist_1
      level: district

    - path: application/gis/Taluk/Taluk.shp
      name_column: KGISTalukN
      level: taluk
  admin_dir: null
  name_column: name
  level_column: level

tabular:
  # Ordered list of tabular record tables (approved sources only). Every
  # (location, year, season) is matched against the first table at village ->
  # taluk -> district level, falling back to the next table only when no exact
  # match exists. Excluded datasets (data_season.csv, ICRISAT) are removed.
  # The winning record's source is stamped as matched_level / source_path.
  tables:
    # DK grid-cell yields (2018-2023, District/Year/Season/Yield_Proxy_NPP).
    # Phase-2 note: Yield_Proxy_NPP is EXCLUDED as a supervised target — these
    # tables may supply features only, never the yield label.
    - name: DK_Features_2018.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2019.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2020.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2021.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2022.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2023.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true

# Cropping calendar aligned with the season values actually present in the
# tabular data (Kharif / Rabi / Zaid) so every planned season has records.
seasons:
  - name: Kharif
    start_month: 6
    end_month: 10
    start_day: 1
    end_day: 31
  - name: Rabi
    start_month: 11
    end_month: 3
    start_day: 1
    end_day: 31
  - name: Zaid
    start_month: 4
    end_month: 5
    start_day: 1
    end_day: 31
