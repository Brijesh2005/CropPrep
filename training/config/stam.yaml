# STAM (Spatial-Temporal Alignment Module) configuration.
#
# Resolution precedence: ST_* environment variables (``__``-nested) > this
# file > built-in defaults. See ``training/stam/config.py`` for every option.
#
# The tabular block must match the columns of the agricultural record table
# shipped in the repository (training/datasets/tabular/data_season.csv), so
# STAM can resolve years, seasons, crops and yields end-to-end.

patch:
  size: 224
  pad_mode: constant
  pad_value: 0.0
  edge_correction: true

spatial:
  max_search_radius_km: 5.0
  distance_threshold_km: 5.0
  kdtree_leaf_size: 40
  duplicate_tolerance_m: 50.0

temporal:
  default_year: null
  default_season: null
  tolerance_days: 15
  max_gap_days: 60
  # Project calendar (Kharif / Rabi / Zaid) matching data_season.csv's season
  # values. Resolved against the repository root by the pipeline driver.
  season_file: seasons.yaml

image:
  resolution: R10m
  index_types: [NDVI, EVI]
  require_pairs: true

# Temporal imagery acquisition window. "season" is the legacy behaviour —
# only composites inside the season calendar window. For seasonal-composite
# mounts (Kaggle NDVI/EVI: ~5 dates/year clustered late-Apr/May and late-Oct),
# a season window resolves exactly one frame for Kharif surveys; the campaign
# overrides this via ST_IMAGERY__* (see R5.3: multi-season windows).
imagery:
  mode: season
  window_days: 180
  start_month: 5
  span_months: 12
  max_observations: 8
  strategy: closest_to_survey
  require_pairs: true

quality:
  max_temporal_gap_days: 60
  min_observations: 1
  fail_below: 40.0

cache:
  enabled: true
  observation_ttl_seconds: 3600
  index_ttl_seconds: 86400

admin:
  # Karnataka KGIS boundary layers. Each source carries its own KGIS
  # attribute as ``name_column`` and its administrative ``level`` so the
  # combined boundary index exposes both district and taluk names.
  boundaries:
    - path: application/gis/District/District.shp
      name_column: KGISDist_1
      level: district

    - path: application/gis/Taluk/Taluk.shp
      name_column: KGISTalukN
      level: taluk
  admin_dir: null
  name_column: name
  level_column: level

tabular:
  # Ordered list of tabular record tables. Every (location, year, season) is
  # matched against the first table at village -> taluk -> district level,
  # falling back to the next table only when no exact match exists — so the
  # fine-grained data_season.csv (2004-2019, Kharif/Rabi/Zaid) wins over the
  # ICRISAT district-level series (1966-2017, annual) wherever both answer.
  # The winning record's source is stamped as matched_level / source_path.
  tables:
    - name: data_season.csv
      # Location column holds colloquial district/town names (Mangalore,
      # Bangalore, ...). district_column is null: the same column is used for
      # village/taluk attempts, so Madikeri matches via its taluk name.
      village_column: Location
      taluk_column: Location
      district_column: null
      season_column: Season
      year_column: Year
      crop_column: Crops
      yield_column: yeilds
      feature_columns: [Area, Rainfall, Temperature, Soil type, Irrigation, Humidity, price]
      fallback_to_district: false

    # DK grid-cell yield proxies (2018-2023, District/Year/Season/Yield_Proxy_NPP).
    # These fill the tabular gap for the 2020+ imagery years the older series
    # cannot answer. They carry no crop label (crop_column null): matched
    # observations are crop-less and train the yield head only — the crop task
    # is masked for them (label sentinel -1).
    - name: DK_Features_2018.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2019.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2020.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2021.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2022.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true
    - name: DK_Features_2023.csv
      village_column: null
      taluk_column: null
      district_column: District
      season_column: Season
      year_column: Year
      crop_column: null
      yield_column: Yield_Proxy_NPP
      feature_columns: []
      fallback_to_district: true

    - name: ICRISAT-District Level Data.csv
      # District-level annual series for 20 states. crop/yield columns are
      # null: the wide "<CROP> AREA/YIELD" triples are reduced to the dominant
      # crop (largest planted area) whose yield becomes the record label.
      village_column: null
      taluk_column: null
      district_column: Dist Name
      season_column: null
      year_column: Year
      crop_column: null
      yield_column: null
      feature_columns: []
      state_column: State Name
      state_value: Karnataka
      fallback_to_district: true

# Cropping calendar aligned with the season values actually present in the
# tabular data (Kharif / Rabi / Zaid) so every planned season has records.
seasons:
  - name: Kharif
    start_month: 6
    end_month: 10
    start_day: 1
    end_day: 31
  - name: Rabi
    start_month: 11
    end_month: 3
    start_day: 1
    end_day: 31
  - name: Zaid
    start_month: 4
    end_month: 5
    start_day: 1
    end_day: 31
