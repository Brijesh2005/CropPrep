# CropFusion project cropping-season calendar.
#
# Aligned with the season values present in the agricultural record table
# (training/datasets/tabular/data_season.csv): Kharif / Rabi / Zaid.
# Referenced from training/config/stam.yaml via ``temporal.season_file`` so
# the bundled package default (Kharif / Rabi / Summer) stays untouched.
version: "1"
seasons:
  - name: Kharif
    start_month: 6
    end_month: 10
    start_day: 1
    end_day: 31
  - name: Rabi
    start_month: 11
    end_month: 3
    start_day: 1
    end_day: 31
  - name: Zaid
    start_month: 4
    end_month: 5
    start_day: 1
    end_day: 31
