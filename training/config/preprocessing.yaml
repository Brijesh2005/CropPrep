# Preprocessing configuration for the CropFusion pipeline.
#
# Loaded by ``training.preprocessing.config.load_preprocessing_config`` and
# wired into the training pipeline (``training/kaggle/scripts/run_pipeline.py``).
#
# Accuracy improvements (per CropFusion_Accuracy_Improvement_Guide.md):
# - 224x224 imagery (matches the pretrained CNN input size).
# - Ordinal encoding for categorical tabular fields so the model learns
#   categorical embeddings (no one-hot blow-up / sparsity).
# - Deterministic image augmentation to expand the tiny accepted corpus.

tabular:
  scaler: standard
  handle_missing: mean
  outlier_method: iqr
  categorical_encoding: ordinal
  # NOTE: feature lists MUST match columns actually present per observation.
  # R5.2.9 (enhanced observation generator) emits the interpolated DK grid
  # environmental features per observation, so the numeric/categorical lists
  # below cover BOTH the base frozen fields (lat/lon/distance/year/season) and
  # the R5.2.9 environmental extensions. Legacy R5.2.7 observations that lack
  # the env keys are mean-imputed by handle_missing during preprocessing.
  numeric_features:
    - lat
    - lon
    - spatial_match_distance_km
    - year
    - annual_rainfall_mm
    - dewpoint_c
    - elevation
    - temperature_c
    - relative_humidity_pct
    - slope
    - ndvi
    - evi
    - ndwi
    - ndre
    - savi
    - s2_obs_count
    - soil_clay_pct
    - soil_sand_pct
    - soil_organic_carbon
    - soil_ph
    - soil_moisture
    - kharif_ndvi
    - kharif_evi
    - kharif_ndwi
    - rabi_ndvi
    - rabi_evi
    - rabi_ndwi
    - env_match_distance_m
  categorical_features: [season, is_cropland, land_cover_class, soil_type_class]
  exclude_columns: []

image:
  size: 224
  normalize: minmax

temporal:
  max_observations: 8

augmentation:
  enabled: true
  flip_horizontal: true
  flip_vertical: true
  rotation_degrees: [0, 90, 180, 270]
  random_crop: false
  crop_fraction: 0.9
  # NDVI / EVI are scientific measurements — only physically reasonable,
  # geometry-preserving augmentations (flips / 90-degree rotations). Photometric
  # jitter and additive noise would corrupt reflectance-derived vegetation
  # indices, so they stay disabled (brightness_jitter / contrast_jitter / noise_std = 0).
  brightness_jitter: 0.0
  contrast_jitter: 0.0
  noise_std: 0.0

split:
  strategy: temporal

dataloader:
  batch_size: 16

quality:
  min_quality_score: 40.0
