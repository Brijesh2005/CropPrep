[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cropfusion-feature-engineering"
version = "0.1.0"
description = "CropFusion R2.3 feature builders, dataset statistics and class balancing"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pandas>=2",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["training.feature_engineering*"]
