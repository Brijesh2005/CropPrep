[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cropfusion-spatial-alignment"
version = "0.1.0"
description = "CropFusion Spatial-Temporal Alignment Module (STAM) — fuses tabular data + Sentinel-2 indices into observations"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = [
    "cache", "config", "coordinate_transform", "exceptions",
    "historical_context", "interfaces", "logger", "matcher", "observation",
    "patch_generator", "season_resolver", "sequence_builder", "spatial_index",
    "stam", "temporal_index", "validators",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "docs", "docs.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
addopts = "-q --strict-markers"
