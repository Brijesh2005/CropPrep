[pytest]
minversion = 8.0
testpaths = application/tests application/backend/app/tests training shared scripts/tests
pythonpath = . application/backend
addopts = -ra --strict-markers --strict-config --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    unit: Fast, isolated unit tests (no I/O, no DB, no network)
    integration: Multi-component tests (backend + DB, dataset manager, inference pipeline)
    system: End-to-end system tests across layers
    backend: Backend-only tests
    database: Database / repository / migration tests
    gis: GIS / spatial tests
    ai: AI model / preprocessing / training tests
    api: HTTP API endpoint tests
    security: Security and OWASP-focused tests
    smoke: Startup / health / ready smoke tests
    e2e: Browser end-to-end tests (Playwright)
    performance: Benchmark and performance tests (pytest-benchmark)
    drift: Data drift monitoring tests
    fairness: Fairness evaluation tests
    monitoring: Observability / metrics tests
    optimization: Inference optimization tests
    redis: Tests requiring a live Redis
    frontend: Frontend tests (run via vitest, referenced here)
    slow: Long-running tests excluded from the default suite
