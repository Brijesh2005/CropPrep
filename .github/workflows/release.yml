name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Release gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          pip install -q -e ./training/models ./training/preprocessing ./training/training ./training/explainability
          pip install -q -e ./training/dataset_manager ./training/stam
      - name: Test
        run: pytest -q

  release:
    name: Create release artifacts
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Export version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > VERSION
      - name: Bundle source tarball
        run: |
          tar -czf cropfusion-${{ steps.version.outputs.version }}.tar.gz \
            --exclude=node_modules --exclude=.pytest_cache --exclude=__pycache__ \
            --exclude=application/backend/datasets --exclude=Tabular_Datasets \
            --exclude=.git .
      - name: Generate release notes
        run: |
          cat > release-notes.md <<'EOF'
          CropFusion ${{ steps.version.outputs.version }}

          Full release notes: see docs/releases/.

          ## Highlights
          - Multimodal crop-yield prediction (TabTransformer + Dual-CNN + temporal Transformer + cross-modal fusion)
          - Enterprise FastAPI backend with PostGIS, Redis, RBAC, audit logging
          - Drift / fairness monitoring with Grafana dashboards
          - ONNX + quantization inference optimization
          - Docker Compose deployment (dev + prod), CI/CD, MLOps scheduler
          EOF
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CropFusion ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            cropfusion-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
