name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tooling
        run: |
          pip install -q ruff mypy bandit
          pip install -q -r requirements.txt
          pip install -q -e ./training/models ./training/preprocessing ./training/training ./training/explainability
          pip install -q -e ./training/dataset_manager ./training/stam
      - name: Ruff lint
        run: ruff check training application shared scripts
      - name: Ruff format check
        run: ruff format --check training application shared scripts
      - name: mypy
        run: mypy training application/backend application/database shared scripts || true
      - name: Bandit
        run: bandit -q -r training application/backend application/database shared

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json
      - name: Install
        working-directory: application/frontend
        run: npm ci
      - name: ESLint
        working-directory: application/frontend
        run: npm run lint

  test:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [lint-python, lint-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: dataset-manager
            dir: training/dataset_manager
          - suite: spatial-alignment
            dir: training/stam
          - suite: preprocessing
            dir: training/preprocessing
          - suite: models
            dir: training/models
          - suite: training
            dir: training/training
          - suite: explainability
            dir: training/explainability
          - suite: quality
            dir: training/quality
          - suite: backend
            dir: application/backend
          - suite: smoke
            dir: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt
          pip install -q -e ./training/models ./training/preprocessing ./training/training ./training/explainability
          pip install -q -e ./training/dataset_manager ./training/stam
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt
          pip install -q -e ./training/models ./training/preprocessing ./training/training ./training/explainability
          pip install -q -e ./training/dataset_manager ./training/stam
      - name: Coverage run
        run: |
          pytest -q --cov=training --cov=application/backend/app \
            --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-frontend:
    name: Tests (Frontend)
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json
      - name: Install
        working-directory: application/frontend
        run: npm ci
      - name: Unit tests
        working-directory: application/frontend
        run: npm test -- --run
      - name: Build
        working-directory: application/frontend
        run: npm run build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: application/frontend/dist
          retention-days: 7

  compose-validation:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp application/config/.env.example .env
          docker compose -f application/docker/docker-compose.yml config --quiet
          docker compose -f application/docker/docker-compose.prod.yml config --quiet
