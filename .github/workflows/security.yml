name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  python:
    name: Python dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q -r requirements.txt
          pip install -q -r requirements-dev.txt
      - name: Safety (runtime deps)
        run: safety check -r requirements.txt --full-report || true
      - name: Bandit
        run: bandit -q -r training application/backend application/database shared -f json -o bandit.json || true
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit
          path: bandit.json
          retention-days: 14

  container:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f application/docker/Dockerfile.backend -t cropfusion/backend:scan .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: cropfusion/backend:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  frontend:
    name: Frontend audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        working-directory: application/frontend
        run: npm audit --audit-level=high || true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
