# CropFusion - local development orchestration.
#
#   docker compose up -d                      # core stack
#   docker compose --profile devtools up -d   # + pgadmin
#   docker compose --profile mlops up -d      # + admin scheduler
#   docker compose --profile gpu up -d        # + warm inference replica
#
# See DEPLOYMENT.md for the production file (docker-compose.prod.yml).

name: cropfusion

x-app-base: &app-base
  restart: unless-stopped
  env_file:
    - ../.env

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cropfusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cropfusion}
      POSTGRES_DB: ${POSTGRES_DB:-cropfusion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cropfusion} -d ${POSTGRES_DB:-cropfusion}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ app
  backend:
    build:
      context: ..
      dockerfile: application/docker/Dockerfile.backend
    <<: *app-base
    environment:
      BACKEND_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-cropfusion}:${POSTGRES_PASSWORD:-cropfusion}@postgres:5432/${POSTGRES_DB:-cropfusion}
      BACKEND_DATABASE__POSTGIS: "true"
      BACKEND_DATABASE__ECHO: "false"
      BACKEND_REDIS__URL: redis://redis:6379/0
      BACKEND_MONITORING__PROMETHEUS_ENABLED: "true"
      BACKEND_MONITORING__TRACING_ENABLED: "true"
      BACKEND_SECURITY__SECURE_COOKIES: "false"
      BACKEND_MODEL__WARMUP: "true"
      BACKEND_CONFIG_FILE: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models
      - datasetdata:/app/data

  inference:
    build:
      context: ..
      dockerfile: application/docker/Dockerfile.inference
    profiles: ["gpu"]
    <<: *app-base
    environment:
      BACKEND_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-cropfusion}:${POSTGRES_PASSWORD:-cropfusion}@postgres:5432/${POSTGRES_DB:-cropfusion}
      BACKEND_REDIS__URL: redis://redis:6379/0
      BACKEND_MODEL__WARMUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ..
      dockerfile: application/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    <<: *app-base
    depends_on:
      - backend
    ports:
      - "3000:80"

  admin:
    build:
      context: ..
      dockerfile: application/docker/Dockerfile.admin
    profiles: ["mlops"]
    <<: *app-base
    environment:
      BACKEND_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-cropfusion}:${POSTGRES_PASSWORD:-cropfusion}@postgres:5432/${POSTGRES_DB:-cropfusion}
      BACKEND_REDIS__URL: redis://redis:6379/0
      BACKEND_MONITORING__PROMETHEUS_ENABLED: "true"
      MLOPS_INTERVAL_SECONDS: ${MLOPS_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models:/app/models
      - reports:/app/reports

  docs:
    build:
      context: ..
      dockerfile: application/docker/Dockerfile.docs
    ports:
      - "8080:80"

  # ------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../training/quality/monitoring/grafana:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ../monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,ro
    ports:
      - "9100:9100"

  # ------------------------------------------------------------- devtools
  pgadmin:
    image: dpage/pgadmin4:8
    profiles: ["devtools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cropfusion.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
  models:
  reports:
  promdata:
  grafanadata:
  lokidata:
  datasetdata:
