# Prometheus - scrape configuration for CropFusion.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: cropfusion-backend

  - job_name: "inference"
    metrics_path: /metrics
    static_configs:
      - targets: ["inference:8001"]
        labels:
          service: cropfusion-inference

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host
