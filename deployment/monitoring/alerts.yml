# Prometheus alerting rules for CropFusion.
groups:
  - name: cropfusion
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: cropfusion-backend
        annotations:
          summary: "Backend is unreachable"

      - alert: HighErrorRate
        expr: |
          sum(rate(cropfusion_requests_total{status=~"5.."}[5m])) by (service)
          / sum(rate(cropfusion_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate above 5%"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(cropfusion_request_duration_seconds_bucket[5m])) by (le))
          > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 2s"

      - alert: DriftDetected
        expr: cropfusion_drift_score > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Concept/data drift score above threshold"

      - alert: LowDiskSpace
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 90%"
