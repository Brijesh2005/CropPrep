[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cropfusion-dataset-manager"
version = "0.1.0"
description = "CropFusion Dataset Management System — the single access point for all datasets"
requires-python = ">=3.12"

[project.optional-dependencies]
# Core runtime dependencies (see requirements.txt for the pinned set).
dev = [
    "pytest>=8.0",
    "pyarrow>=15.0",
]

[tool.setuptools]
py-modules = [
    "cache_manager", "cli", "config", "csv_loader", "dataset_registry",
    "downloader", "exceptions", "image_loader", "interfaces", "logger",
    "manager", "manager_paths", "manage_dataset", "metadata", "models",
    "scanner", "utils", "validator", "version_manager", "_db",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "docs", "docs.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the repository root importable so `services.dataset_manager` resolves
# when running pytest from this directory.
pythonpath = ["../.."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
