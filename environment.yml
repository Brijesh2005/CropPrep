# CropFusion - reproducible conda environment.
#
#   conda env create -f environment.yml
#   conda activate cropfusion
#   pip install -e ./training/models ./training/preprocessing ./training/training ./training/explainability
#   pip install -e ./training/dataset_manager ./training/stam
#
# Runtime dependencies are pinned in requirements.txt (installed via pip),
# keeping the conda layer minimal and cross-platform.

name: cropfusion
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip>=24
  - gdal>=3.8
  - git
  - pip:
      - -r requirements.txt
      - -r requirements-dev.txt
